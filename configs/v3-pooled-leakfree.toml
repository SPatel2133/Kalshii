# Post-hoc exploratory sensitivity run with a common label cutoff before the earliest city test window.
# Five-city confirmatory pool; NYC is exploratory and Denver is dropped.
city_configs = [
  "configs/v3-chi-0800.toml",
  "configs/v3-mia-0800.toml",
  "configs/v3-aus-0800.toml",
  "configs/v3-lax-0800.toml",
  "configs/v3-phil-0800.toml",
]

leak_free = true
exploratory = true
output_dir = "evidence/v3/pooled-leakfree"

[split]
test_start = "2025-06-24"
test_end = "2026-08-13"

[pool]
block_days = 7
block_sensitivity = [3, 14]
bootstrap_reps = 2000
seed = 20260813
h1_threshold = 0.01
report_threshold = 0.02
